---
# host_vars/soc-splunk-cm.yml — Splunk CLUSTER MANAGER (Linux)
# Image:   global/RDP_Ubuntu_Desktop_22.04.5:1.1.0
# Mgmt:    10.255.240.190/20 (position FIRST → eth0)
# Prod:    172.31.7.28/24 on SOC, gateway bs-sec-rtr (172.31.7.1)
ansible_host: "10.255.240.190"
network_interfaces:
  - name: "eth0"                     # mgmt (position FIRST)
    ipv4:
      type: "ethernet"
      address: "10.255.240.190"
      netmask: "255.255.240.0"
      gateway: ""
  - name: "eth1"                     # production — SOC
    ipv4:
      type: "ethernet"
      address: "172.31.7.28"
      netmask: "255.255.255.0"
      gateway: "172.31.7.1"
    dns:
      - "172.31.2.7"                 # bs-dc01
      - "172.31.2.8"                 # bs-dc02

# --- Splunk role contract -------------------------------------------------
# Cluster manager, and the ONLY holder of the Enterprise license. Every other
# Splunk node is a license peer pointed at this host -- see
# roles/splunk_license_peer, which actively REMOVES locally installed licenses
# so a node cannot quietly become its own license manager.
#
# Smallest box in the tier: it distributes configuration and tracks peer state,
# it neither indexes nor searches.
#
# NOT in [splunk-forwarder]: this host IS Splunk. It is listed in
# [splunk_forwarder_exempt] via [splunk_all], so the forwarder-coverage gate
# in playbooks/75-endpoint.yml treats its absence as a decision rather than a
# gap. It DOES carry an Elastic Agent -- Security Onion monitors the Splunk
# tier, exactly as Splunk monitors the SO sensors.
