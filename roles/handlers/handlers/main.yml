---
- name: Restart NetworkManager
  listen: Restart NetworkManager
  become: true
  ansible.builtin.service:
    name: NetworkManager
    state: restarted

- name: Restart squid
  listen: Restart squid
  become: true
  ansible.builtin.service:
    name: squid
    enabled: true
    state: restarted

- name: Restart apache2
  listen: Restart apache2
  become: true
  ansible.builtin.service:
    name: apache2
    enabled: true
    state: restarted

# 1800, not 120. Two minutes is not a Linux reboot on a busy hypervisor, let
# alone a Security Onion node. Raised 2026-09-23 alongside the Windows
# ceilings, which were fixed on 2026-09-22 -- this one was missed because the
# audit that found those matched `win_reboot`, and Linux uses
# ansible.builtin.reboot.
#
# The same blind spot cost a deploy the same day: `common : reboot when
# changed` on so-search timed out at the bare module default of 600s.
#
# A CEILING, NOT A DELAY -- reboot returns as soon as the host answers.
- name: Reboot Linux
  become: true
  ansible.builtin.reboot:
    reboot_timeout: 1800

# 1800, not 600. A member workstation is back in two or three minutes; a
# domain controller on its first boot after promotion has to bring up NTDS,
# Netlogon, ADWS and SYSVOL replication before it answers, and routinely takes
# longer than ten minutes. On 2026-09-19 bs-dc01 and bs-dc02 both hit
#
#   Timed out waiting for last boot time check (timeout=600.0)
#   "rebooted": true, "elapsed": 608
#
# ...having actually rebooted fine. The handler gave up six hundred seconds in
# and both DCs failed out of the run over a wait that was simply too short.
#
# This is a CEILING, not a delay: a host that comes back in 90 seconds still
# takes 90 seconds. Raising it costs nothing and removes a whole class of
# false failure.
- name: Reboot Windows
  ansible.windows.win_reboot:
    reboot_timeout: 1800

# Splunk handlers. airfield-range removed Splunk entirely when it went
# Security-Onion-only, so this role arrived here stripped of them while
# roles/splunk and roles/splunk-es -- copied in from ss-pp-stacked -- still
# notify them. Measured 2026-09-26: attempt 1 ran 4h31m and then died on
#   ERROR! The requested handler 'Initialize Splunk' was not found in either
#   the main handlers list nor in the listening handlers list
# at splunk : Copy Splunk Installer. `Restart Splunk Service` was missing too and
# would have ended the next attempt the same way.
#
# Copied verbatim from ss-pp-stacked, where this Splunk build is proven.
- name: Initialize Splunk
  # BOUNDED. The Splunk CLI can spin forever instead of failing: measured
  # 2026-09-27 on soc-splunk-cm, `splunk list license -auth ...` sat in state R
  # burning CPU for 18h57m and took a --forks 76 deploy with it. Ansible has no
  # per-task timeout by default, so nothing ever interrupted it. rc 124 from a
  # bounded task is a diagnosis; an unbounded one is a dead range.
  timeout: 600
  ansible.builtin.shell: >
    /opt/splunk/bin/splunk enable boot-start --accept-license --no-prompt
    --answer-yes --seed-passwd {{ splunk_admin_password }}
  listen: Initialize Splunk
  changed_when: false

- name: Start Splunk After Installing and Initializing
  # BOUNDED. The Splunk CLI can spin forever instead of failing: measured
  # 2026-09-27 on soc-splunk-cm, `splunk list license -auth ...` sat in state R
  # burning CPU for 18h57m and took a --forks 76 deploy with it. Ansible has no
  # per-task timeout by default, so nothing ever interrupted it. rc 124 from a
  # bounded task is a diagnosis; an unbounded one is a dead range.
  timeout: 600
  ansible.builtin.systemd:
    name: splunk
    enabled: true
    state: started
  register: splunk_status
  listen: Initialize Splunk

- name: Restart Splunk Service
  # BOUNDED. The Splunk CLI can spin forever instead of failing: measured
  # 2026-09-27 on soc-splunk-cm, `splunk list license -auth ...` sat in state R
  # burning CPU for 18h57m and took a --forks 76 deploy with it. Ansible has no
  # per-task timeout by default, so nothing ever interrupted it. rc 124 from a
  # bounded task is a diagnosis; an unbounded one is a dead range.
  timeout: 600
  ansible.builtin.systemd:
    name: splunk
    state: restarted
  listen: Restart Splunk Service

- name: reload unbound
  community.docker.docker_container_exec:
    container: "{{ global_dns_container_name }}"
    command: unbound-control reload
  ignore_errors: yes

- name: Update CA Certificates
  ansible.builtin.command:
    cmd: /usr/sbin/update-ca-certificates

- name: Recreate email container
  listen: Recreate email container
  ansible.builtin.shell: docker compose up -d --no-deps outlook
  args:
    chdir: /home/simspace

- name: Run add_users in email container
  listen: Run add_users in email container
  community.docker.docker_container_exec:
    container: email
    command: /bin/bash /add_users.sh

- name: Restart email container
  listen: Restart email container
  ansible.builtin.shell: docker restart email


# THE OVERLAY MUST BE THE COMPLETE BASE SET. resolve_role_path selects ONE
# directory, so this file REPLACES range-development-ansible/roles/handlers
# wholesale -- it never merges. Every handler the base role defines has to be
# here, or a role copied in later that notifies one aborts the deploy at run
# time. That is not hypothetical: the Splunk handlers were absent from this file
# and airfield-stacked ran 4h31m before dying on "The requested handler
# 'Initialize Splunk' was not found". These two were missing for the same reason
# and nothing had notified them yet. verify_handlers.py now fails the build
# instead of the deploy.
- name: Reload systemd
  become: true
  ansible.builtin.systemd:
    daemon_reload: true

- name: Restart network_mgr
  become: true
  ansible.builtin.systemd:
    name: network_mgr.service
    state: restarted
