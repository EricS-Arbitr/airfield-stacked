---
- name: Ensure Splunk Tmp Directory Exists
  ansible.builtin.file:
    path: "{{ staging_dir_linux }}/splunk"
    state: directory
    mode: '0755'
  register: tmp_directory_check

- name: Download splunk server installer
  ansible.builtin.get_url:
    url: "{{ splunk_server_installer }}"
    dest: "{{ staging_dir_linux }}/splunk/splunk.deb"
    use_proxy: yes
    timeout: 300
    validate_certs: no
  environment:
    http_proxy: "http://{{ inet_proxy_addr }}:{{ inet_proxy_port }}"
    https_proxy: "https://{{ inet_proxy_addr }}:{{ inet_proxy_port }}"

- name: Copy Splunk Installer 
  ansible.builtin.copy:
    src: "{{ ansible_installers }}/splunk/splunk.deb"
    dest: "{{ staging_dir_linux }}/splunk/splunk.deb"
    mode: '0755'

- name: Install Splunk
  ansible.builtin.apt:
    deb: "{{ staging_dir_linux }}/splunk/splunk.deb"
    state: present
  register: splunk_install
  # NO `notify:` HERE ANY MORE. See "Has splunkd ever run" below: a notify fires
  # only when apt reports changed, so a re-run over an already-installed Splunk
  # never initialised it.

- name: Write imits.conf Template
  ansible.builtin.template:
    src: limits.conf.j2
    dest: /opt/splunk/etc/system/local/limits.conf
    mode: '0644'

- name: Write inputs.conf Template
  ansible.builtin.template:
    src: inputs.conf.j2
    dest: /opt/splunk/etc/system/local/inputs.conf
    mode: '0644'

- name: Write server.conf Template
  ansible.builtin.template:
    src: server.conf.j2
    dest: /opt/splunk/etc/system/local/server.conf
    mode: '0644'

- name: Write in web.conf Template
  ansible.builtin.template:
    src: web.conf.j2
    dest: /opt/splunk/etc/system/local/web.conf
    mode: '0644'

# Flush handlers before setting license
- name: Flush handlers
  ansible.builtin.meta: flush_handlers

# INITIALISATION IS GATED ON THE OUTCOME, NOT ON WHETHER THE INSTALL CHANGED.
#
# It used to be a handler notified by `Install Splunk`, which fires only when apt
# reports changed. MEASURED 2026-09-27 on soc-splunk-cm: the 2026-09-26 attempt
# installed the .deb and then aborted on the missing `Initialize Splunk` handler,
# leaving Splunk installed but never initialised. The next run found the install
# unchanged, so nothing notified, so initialisation never happened -- and every
# later `splunk` CLI call then blocked on the FIRST-RUN LICENCE PROMPT waiting on a
# stdin that is not there:
#
#   systemctl is-active splunk             inactive
#   timeout 20 splunk status               rc=124  (even `status`, which needs no auth)
#   /opt/splunk/var/log/splunk/splunkd.log absent -- splunkd had never run
#
# `splunk list license` sat in state R for 18h57m and held a --forks 76 deploy for
# ~20 hours. Adding the handler was necessary but could not be sufficient: on a
# host where the install had already happened there was nothing left to notify.
#
# splunkd.log is the marker because it is the outcome the next step actually needs
# -- it exists if and only if splunkd has run at least once. An `installed` check
# would have passed on exactly the broken host.
- name: Has splunkd ever run on this host
  ansible.builtin.stat:
    path: /opt/splunk/var/log/splunk/splunkd.log
  register: splunk_ever_started

- name: Accept the licence, enable boot-start and seed the admin password
  ansible.builtin.shell: >
    /opt/splunk/bin/splunk enable boot-start --accept-license --no-prompt
    --answer-yes --seed-passwd {{ splunk_admin_password }}
  # Bounded: this is the call that accepts the licence, so it is the one most
  # likely to sit on the prompt if any flag ever stops working.
  timeout: 600
  when: not splunk_ever_started.stat.exists

- name: Start Splunk and enable it at boot
  ansible.builtin.systemd:
    name: splunk
    enabled: true
    state: started
  timeout: 600
  when: not splunk_ever_started.stat.exists

- name: Create License Directory
  ansible.builtin.file:
    path: "/opt/splunk/etc/licenses"
    state: directory
    mode: '0755'

- name: Download splunk license
  ansible.builtin.get_url:
    url: "{{ splunk_license }}"
    dest: "/opt/splunk/etc/licenses/splunk.license"
    use_proxy: yes
    timeout: 300
    validate_certs: no
  environment:
    http_proxy: "http://{{ inet_proxy_addr }}:{{ inet_proxy_port }}"
    https_proxy: "https://{{ inet_proxy_addr }}:{{ inet_proxy_port }}"

- name: Check License Status
  # BOUNDED. The Splunk CLI can spin forever instead of failing: measured
  # 2026-09-27 on soc-splunk-cm, `splunk list license -auth ...` sat in state R
  # burning CPU for 18h57m and took a --forks 76 deploy with it. Ansible has no
  # per-task timeout by default, so nothing ever interrupted it. rc 124 from a
  # bounded task is a diagnosis; an unbounded one is a dead range.
  timeout: 300
  ansible.builtin.shell: |
    /opt/splunk/bin/splunk list license -auth "{{ splunk_admin }}:{{ splunk_admin_password }}" 
  register: license_check
  changed_when: false
  failed_when: false

- name: Apply Splunk License
  # BOUNDED. The Splunk CLI can spin forever instead of failing: measured
  # 2026-09-27 on soc-splunk-cm, `splunk list license -auth ...` sat in state R
  # burning CPU for 18h57m and took a --forks 76 deploy with it. Ansible has no
  # per-task timeout by default, so nothing ever interrupted it. rc 124 from a
  # bounded task is a diagnosis; an unbounded one is a dead range.
  timeout: 300
  ansible.builtin.shell: >
    /opt/splunk/bin/splunk add license /opt/splunk/etc/licenses/splunk.license
    -auth "{{ splunk_admin }}:{{ splunk_admin_password }}"
  when: "'stack_id:enterprise' not in license_check.stdout"
  register: license_result
  changed_when: "'already exists' not in license_result.stdout"
  notify: Restart Splunk Service

- name: Check Index Status
  # BOUNDED. The Splunk CLI can spin forever instead of failing: measured
  # 2026-09-27 on soc-splunk-cm, `splunk list license -auth ...` sat in state R
  # burning CPU for 18h57m and took a --forks 76 deploy with it. Ansible has no
  # per-task timeout by default, so nothing ever interrupted it. rc 124 from a
  # bounded task is a diagnosis; an unbounded one is a dead range.
  timeout: 300
  ansible.builtin.shell: |
    /opt/splunk/bin/splunk list index -auth "{{ splunk_admin }}:{{ splunk_admin_password }}"| grep "^[a-zA-Z]" | cut -f1
  register: existing_indices
  changed_when: false

- name: Create Indices
  # BOUNDED. The Splunk CLI can spin forever instead of failing: measured
  # 2026-09-27 on soc-splunk-cm, `splunk list license -auth ...` sat in state R
  # burning CPU for 18h57m and took a --forks 76 deploy with it. Ansible has no
  # per-task timeout by default, so nothing ever interrupted it. rc 124 from a
  # bounded task is a diagnosis; an unbounded one is a dead range.
  timeout: 300
  ansible.builtin.shell: >
    /opt/splunk/bin/splunk add index "{{ item.name }}"
    -auth "{{ splunk_admin }}:{{ splunk_admin_password }}"
  loop: "{{ indices }}"
  when: item.name not in existing_indices.stdout_lines
  register: index_result
  changed_when: "'already exists' not in index_result.stdout"

- name: Disable syslog host extraction transforms
  ansible.builtin.blockinfile:
    path: /opt/splunk/etc/system/local/props.conf
    block: |
      [syslog]
      TRANSFORMS-syslog-host =
      TRANSFORMS-syslog-host-full =
    marker: ""
    owner: root
    group: root
    mode: '0644'
    create: yes
